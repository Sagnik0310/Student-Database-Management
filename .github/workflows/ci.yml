name: CI — Backend & Frontend Verification

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint, Dependency & Pytest Suite (Python 3.11)
    runs-on: ubuntu-latest
    env:
      STUDENTDB_TEST_MODE: "1"
      APP_ENV: "development"
      SECRET_KEY: "ci-ephemeral-test-only-key-minimum-32-characters-long"
      AI_ASSISTANT_PROVIDER: "deterministic"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            backend/api/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verify dependency compatibility
        run: pip check

      - name: Compile & syntax-check all Python modules
        run: python -m compileall -q backend database logs models services cli tests main.py

      - name: Execute isolated pytest suite
        run: python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend Test & Production Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies cleanly
        run: npm ci

      - name: Run React Testing Library suite
        run: npm test -- --watchAll=false

      - name: Build production frontend bundle
        run: npm run build

